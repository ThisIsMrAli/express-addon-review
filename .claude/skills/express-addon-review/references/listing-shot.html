<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Listing shot</title>
  <link rel="stylesheet" href="listing-shot.css" />
</head>
<!-- Locked template. data-shot is cover, feature, or path.
     Always create these pages with scripts/prepare-listing.mjs.
     Replace only visible strings and img src with add-on quotes and #root captures.
     Do not move .copy after .stage. Do not invent classes or CSS.
     Leave the star out when its cutout still has a gray rectangle. -->
<body data-shot="cover">
  <div class="wash"></div>
  <div class="dots"></div>
  <img class="float float-star" src="star.png" alt="" />
  <div class="safe">
    <div class="copy">
      <p class="kicker">Short phrase from the UI</p>
      <h1>Real count or feature</h1>
      <p class="sentence">One sentence already written in the add-on.</p>
      <div class="pills">
        <span>Fact</span>
        <span>Fact</span>
        <span>Fact</span>
      </div>
    </div>
    <div class="stage">
      <div class="card back"><img src="panel-back.png" alt="" /></div>
      <div class="card front"><img src="panel-front.png" alt="" /></div>
      <div class="card mid"><img src="panel-mid.png" alt="" /></div>
      <div class="card third"><img src="panel-third.png" alt="" /></div>
    </div>
  </div>
</body>
</html>
