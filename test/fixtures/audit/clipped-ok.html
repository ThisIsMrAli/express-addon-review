<!doctype html><meta charset="utf-8"><title>A tile half scrolled out of its list is not covered by the toast below the list</title>
<style>
  body { margin: 0; font: 14px system-ui; color: #111; background: #fff; }
  .list { height: 300px; overflow: hidden; padding: 0 12px; }
  .tile { display: block; width: 100%; height: 100px; margin: 0 0 10px; box-sizing: border-box; border: 1px solid #888; background: #fff; color: #111; }
  .toast { height: 120px; margin: 0 12px; background: #eef; padding: 8px; box-sizing: border-box; }
</style>
<div class="list">
  <button class="tile">Pack one</button><button class="tile">Pack two</button><button class="tile">Pack three</button><button class="tile">Pack four</button>
</div>
<div class="toast"><button style="height: 32px">Unlock</button></div>
