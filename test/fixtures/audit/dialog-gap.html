<!doctype html><meta charset="utf-8"><title>A dialog with a tall empty band</title>
<style>
  body { margin: 0; font: 14px system-ui; background: #fff; color: #1b1b1b; }
  .underlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); }
  [role=dialog] { position: fixed; left: 16px; right: 16px; top: 24px; height: 640px; display: flex; flex-direction: column; justify-content: space-between; background: #f8f8f8; border-radius: 8px; padding: 16px 24px 24px; box-sizing: border-box; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h2 { margin: 0; font-size: 18px; }
  .dismiss { width: 32px; height: 32px; border: 0; background: none; font-size: 20px; }
  .start { height: 40px; }
</style>
<div class="underlay"></div>
<section role="dialog" aria-label="How it works">
  <div>
    <header><h2>How it works</h2><button class="dismiss" aria-label="Close">×</button></header>
    <p>Pick a shape, then add your image.</p>
  </div>
  <button class="start">Start designing</button>
</section>
