<!doctype html><meta charset="utf-8"><title>An open menu and a sticky bar cover things on purpose</title>
<style>
  body { margin: 0; font: 14px system-ui; color: #111; background: #fff; }
  .top { position: relative; height: 50px; }
  .top .other { position: absolute; left: 12px; top: 56px; width: 100px; height: 32px; }
  .menu { position: absolute; left: 0; top: 46px; width: 220px; height: 90px; background: #fff; border: 1px solid #444; z-index: 5; }
  .list { height: calc(100vh - 50px); overflow: auto; padding: 0 12px 90px; }
  .tile { display: block; width: 100%; height: 150px; margin: 0 0 10px; box-sizing: border-box; border: 1px solid #888; background: #fff; color: #111; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: #eef; padding: 8px; box-sizing: border-box; }
</style>
<div class="top">
  <button aria-expanded="true" style="margin: 8px 12px; height: 32px">Options</button>
  <button class="other">Other</button>
  <div class="menu"><button style="margin: 4px; height: 32px; min-width: 100px">Tint icons</button></div>
</div>
<div class="list">
  <button class="tile">Pack one</button><button class="tile">Pack two</button><button class="tile">Pack three</button><button class="tile">Pack four</button>
  <button class="tile">Pack five</button><button class="tile">Pack six</button><button class="tile">Pack seven</button><button class="tile">Pack eight</button>
</div>
<div class="bar"><button style="height: 32px">Unlock</button></div>
